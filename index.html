<script>
// Skill bars reveal on scroll
const skillObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.querySelectorAll('.skill-fill').forEach(fill => {
        fill.style.width = fill.dataset.width + '%';
      });
    }
  });
}, { threshold: 0.3 });
document.querySelectorAll('.skill-bars').forEach(el => skillObserver.observe(el));

// Reveal animations
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

// EmailJS
emailjs.init("9sMK_0V3sivmDqNEJ");
function sendEmail() {
  const name = document.getElementById('from_name').value.trim();
  const msg = document.getElementById('message').value.trim();
  const status = document.getElementById('email-status');
  if (!name || !msg) {
    status.style.color = '#f87171';
    status.textContent = '⚠ Please fill in all fields.';
    return;
  }
  status.style.color = 'var(--sky2)';
  status.textContent = '⏳ Sending...';
  emailjs.send("service_7so149f", "template_2de3wxi", { from_name: name, message: msg })
    .then(() => {
      status.style.color = '#4ade80';
      status.textContent = '✅ Message sent successfully!';
      document.getElementById('from_name').value = '';
      document.getElementById('message').value = '';
    })
    .catch(error => {
      status.style.color = '#f87171';
      status.textContent = '❌ Failed to send. Please try again.';
      console.error('EmailJS error:', error);
    });
}
</script>
